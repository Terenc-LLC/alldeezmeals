<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALLDEEZMeals — Planning &amp; Shopping</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<style id="wm">/* =====================================================================
   WARM MARKET — refreshed design tokens for ALLDEEZMeals (Phase 1)
   Built ON the existing :root color tokens from src/index.css.
   Colors are preserved verbatim; type / spacing / radius / elevation
   are NEW token layers proposed in this direction.
   Maps back to the app's approach: CSS variables + inline-style objects.
   ===================================================================== */



:root {
  /* ---- COLOR (existing — source of truth, unchanged) ---- */
  --c-primary: #2B8C7E;
  --c-primary-hover: #236F64;
  --c-accent: #F2856B;
  --c-accent-hover: #E37152;
  --c-bg: #FBF7F1;
  --c-surface: #FFFFFF;
  --c-surface-2: #F4F1E9;
  --c-text: #1A3A34;
  --c-text-muted: #7C8A80;
  --c-border: #E6DDD0;
  --c-on-primary: #FFFFFF;
  --c-success-bg: #E6F1EC;
  --c-success-text: #136B58;
  --c-pill-bg: #F2856B;
  --c-pill-text: #5E281A;
  --c-danger: #A8453C;
  --c-danger-bg: #F6E7E4;
  --c-warning: #8A6D3B;
  --c-warning-bg: #F3EAD6;

  /* ---- COLOR (NEW — proposed additions, flagged as gaps) ---- */
  /* GAP: no primary tint existed (success-bg was doubling as one). */
  --c-primary-tint: #E4F0EC;       /* soft teal fill for selected / info */
  /* GAP: no neutral shadow color — shadows were ad-hoc black rgba. */
  --c-shadow: 26 58 52;            /* = --c-text as RGB, for tinted elevation */

  /* ---- TYPE families ---- */
  --font-serif: 'Fraunces', Georgia, serif;     /* display + headings */
  --font-sans: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;

  /* ---- TYPE scale (size / line-height / weight) ---- */
  /* display — page title (Fraunces 600) */
  --t-display-size: 28px;   --t-display-lh: 32px;   --t-display-w: 600;
  /* h1 — screen / section title */
  --t-h1-size: 22px;        --t-h1-lh: 28px;        --t-h1-w: 600;
  /* h2 — meal name / card hero */
  --t-h2-size: 19px;        --t-h2-lh: 25px;        --t-h2-w: 600;
  /* h3 — card title / category header */
  --t-h3-size: 16px;        --t-h3-lh: 22px;        --t-h3-w: 600;
  /* body-lg — emphasized body / list items */
  --t-bodylg-size: 16px;    --t-bodylg-lh: 24px;    --t-bodylg-w: 400;
  /* body — default body */
  --t-body-size: 15px;      --t-body-lh: 22px;      --t-body-w: 400;
  /* body-sm — secondary / descriptions */
  --t-bodysm-size: 13px;    --t-bodysm-lh: 18px;    --t-bodysm-w: 400;
  /* label — UPPERCASE tags, field labels (tracked) */
  --t-label-size: 12px;     --t-label-lh: 16px;     --t-label-w: 700;
  --t-label-tracking: 0.05em;
  /* caption — meta, quantities, attributions */
  --t-caption-size: 11px;   --t-caption-lh: 14px;   --t-caption-w: 600;

  /* ---- SPACING (4px base) ---- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 40px;

  /* ---- RADIUS ---- */
  --radius-sm: 8px;     /* inputs, chips, small controls */
  --radius-md: 12px;    /* buttons, inner blocks */
  --radius-lg: 16px;    /* cards, surfaces */
  --radius-pill: 999px; /* tags, pills, toggles */

  /* ---- ELEVATION (tinted with --c-shadow, not pure black) ---- */
  --elev-0: none;
  --elev-1: 0 1px 2px rgba(var(--c-shadow) / 0.06), 0 1px 3px rgba(var(--c-shadow) / 0.05);
  --elev-2: 0 4px 14px rgba(var(--c-shadow) / 0.09), 0 2px 6px rgba(var(--c-shadow) / 0.05);
  --elev-primary: 0 2px 8px rgba(43, 140, 126, 0.28);

  /* ---- INTERACTION ---- */
  --tap-min: 44px;            /* minimum touch target (mobile) */
  --focus-ring: 0 0 0 3px rgba(43, 140, 126, 0.30);
}

/* =====================================================================
   BASE
   ===================================================================== */
.wm {
  font-family: var(--font-sans);
  color: var(--c-text);
  background: var(--c-bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.wm *, .wm *::before, .wm *::after { box-sizing: border-box; }

/* =====================================================================
   TYPE UTILITIES
   ===================================================================== */
.wm-display { font-family: var(--font-serif); font-size: var(--t-display-size); line-height: var(--t-display-lh); font-weight: var(--t-display-w); letter-spacing: -0.015em; margin: 0; }
.wm-h1 { font-family: var(--font-serif); font-size: var(--t-h1-size); line-height: var(--t-h1-lh); font-weight: var(--t-h1-w); letter-spacing: -0.01em; margin: 0; }
.wm-h2 { font-family: var(--font-serif); font-size: var(--t-h2-size); line-height: var(--t-h2-lh); font-weight: var(--t-h2-w); letter-spacing: -0.01em; margin: 0; }
.wm-h3 { font-family: var(--font-serif); font-size: var(--t-h3-size); line-height: var(--t-h3-lh); font-weight: var(--t-h3-w); margin: 0; }
.wm-bodylg { font-family: var(--font-sans); font-size: var(--t-bodylg-size); line-height: var(--t-bodylg-lh); font-weight: var(--t-bodylg-w); margin: 0; }
.wm-body { font-family: var(--font-sans); font-size: var(--t-body-size); line-height: var(--t-body-lh); font-weight: var(--t-body-w); margin: 0; }
.wm-bodysm { font-family: var(--font-sans); font-size: var(--t-bodysm-size); line-height: var(--t-bodysm-lh); font-weight: var(--t-bodysm-w); margin: 0; }
.wm-label { font-family: var(--font-sans); font-size: var(--t-label-size); line-height: var(--t-label-lh); font-weight: var(--t-label-w); letter-spacing: var(--t-label-tracking); text-transform: uppercase; margin: 0; }
.wm-caption { font-family: var(--font-sans); font-size: var(--t-caption-size); line-height: var(--t-caption-lh); font-weight: var(--t-caption-w); margin: 0; }
.wm-muted { color: var(--c-text-muted); }

/* =====================================================================
   SURFACES
   ===================================================================== */
.wm-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--elev-1);
  padding: var(--space-4);
}
.wm-sunken {
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  padding: var(--space-3);
}

/* =====================================================================
   BUTTONS  (min-height = tap target on mobile)
   ===================================================================== */
.wm-btn {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: var(--t-body-size);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--tap-min);
  padding: 0 var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background .15s, box-shadow .15s, border-color .15s, transform .05s;
  white-space: nowrap;
}
.wm-btn:active { transform: translateY(1px); }
.wm-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.wm-btn--primary { background: var(--c-primary); color: var(--c-on-primary); box-shadow: var(--elev-primary); }
.wm-btn--primary:hover { background: var(--c-primary-hover); }

.wm-btn--secondary { background: var(--c-surface); color: var(--c-primary); border-color: var(--c-border); box-shadow: var(--elev-0); }
.wm-btn--secondary:hover { background: var(--c-surface-2); border-color: var(--c-primary); }

.wm-btn--ghost { background: transparent; color: var(--c-text-muted); border-color: var(--c-border); }
.wm-btn--ghost:hover { background: var(--c-surface-2); color: var(--c-text); }

.wm-btn--block { width: 100%; }
.wm-btn--sm { min-height: 36px; font-size: var(--t-bodysm-size); padding: 0 var(--space-3); border-radius: var(--radius-sm); }

/* =====================================================================
   TAGS / PILLS / BADGES
   ===================================================================== */
.wm-tag {
  display: inline-flex; align-items: center; gap: var(--space-1);
  font-family: var(--font-sans); font-weight: 600;
  font-size: var(--t-caption-size); line-height: 1;
  padding: 5px 10px; border-radius: var(--radius-pill);
  background: var(--c-surface-2); color: var(--c-text-muted);
}
.wm-tag--cuisine { background: var(--c-accent); color: var(--c-pill-text); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.wm-tag--primary { background: var(--c-primary); color: var(--c-on-primary); font-weight: 700; }
.wm-tag--effort  { background: var(--c-accent); color: var(--c-pill-text); font-weight: 700; }
.wm-tag--est     { background: var(--c-warning-bg); color: var(--c-warning); font-weight: 700; }
.wm-tag--catalog { background: var(--c-surface-2); color: var(--c-primary); font-weight: 700; }

/* =====================================================================
   FORM CONTROLS
   ===================================================================== */
.wm-field-label {
  display: block; margin-bottom: var(--space-2);
  font-family: var(--font-sans); font-weight: 700;
  font-size: var(--t-label-size); line-height: var(--t-label-lh);
  letter-spacing: var(--t-label-tracking); text-transform: uppercase;
  color: var(--c-text-muted);
}
.wm-input, .wm-select {
  font-family: var(--font-sans); font-size: var(--t-body-size);
  color: var(--c-text); background: var(--c-surface);
  border: 1px solid var(--c-border); border-radius: var(--radius-sm);
  padding: 0 var(--space-3); min-height: var(--tap-min);
  width: 100%;
}
.wm-input:focus, .wm-select:focus { outline: none; border-color: var(--c-primary); box-shadow: var(--focus-ring); }
.wm-select { appearance: none; background-image: none; cursor: pointer; }

/* =====================================================================
   IMAGE SLOT (placeholder — graceful no-photo state is the default)
   ===================================================================== */
.wm-imgslot {
  position: relative;
  width: 100%;
  border-radius: var(--radius-md);
  overflow: hidden;
  background-color: var(--c-surface-2);
  background-image:
    repeating-linear-gradient(135deg,
      rgba(43,140,126,0.06) 0 10px,
      transparent 10px 20px);
  border: 1px solid var(--c-border);
  display: grid; place-items: center;
}
.wm-imgslot__hint {
  font-family: var(--font-sans);
  font-size: var(--t-caption-size);
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--c-text-muted);
  text-transform: lowercase;
  background: rgba(255,255,255,0.65);
  padding: 4px 10px; border-radius: var(--radius-pill);
}

/* =====================================================================
   GROCERY LIST ROW
   ===================================================================== */
.wm-listrow {
  display: flex; align-items: center; gap: var(--space-3);
  min-height: var(--tap-min); padding: var(--space-1) 0;
}
.wm-check {
  flex: 0 0 auto; width: 24px; height: 24px;
  border-radius: var(--radius-sm); border: 2px solid var(--c-border);
  background: var(--c-surface); cursor: pointer;
  display: grid; place-items: center; transition: background .12s, border-color .12s;
}
.wm-check[data-checked="true"] { background: var(--c-primary); border-color: var(--c-primary); }
.wm-listrow__label { flex: 1 1 auto; min-width: 0; }
.wm-listrow[data-checked="true"] .wm-listrow__name { text-decoration: line-through; color: var(--c-text-muted); }

/* =====================================================================
   DAY CONTROL ROW (spec reference)
   ===================================================================== */
.wm-daycontrol {
  display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center;
}
.wm-daycontrol > * { min-height: var(--tap-min); }

/* =====================================================================
   DIVIDER
   ===================================================================== */
.wm-divider { height: 1px; background: var(--c-border); border: 0; margin: var(--space-4) 0; }
</style>
<style>
:root {
  --font-serif: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
}
.wm-h1, .wm-h2, .wm-h3 { letter-spacing: -0.01em; }
html, body { margin: 0; }
body { background: var(--c-bg); font-family: var(--font-sans); color: var(--c-text); -webkit-font-smoothing: antialiased; }
.page { max-width: 980px; margin: 0 auto; padding: 36px 24px 80px; }
.intro-h { font-family: var(--font-serif); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0; }
.sec-label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--c-text-muted); margin: 32px 0 10px; }
.frame { border: 1px solid var(--c-border); border-radius: 18px; overflow: hidden; box-shadow: 0 8px 30px rgba(26,58,52,.10); background: var(--c-surface); max-width: 880px; margin: 0 auto; }
.navtab { font-family: var(--font-sans); font-size: 13px; font-weight: 600; border: none; background: transparent; color: var(--c-text-muted); padding: 8px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.navtab[data-active="true"] { background: var(--c-surface); color: var(--c-primary); font-weight: 700; box-shadow: 0 1px 3px rgba(26,58,52,.12); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="frames/today-components.jsx"></script>
<script type="text/babel" src="frames/app-screens.jsx"></script>
<script type="text/babel">
const PJS = "'Plus Jakarta Sans', sans-serif";

function DPlateIcon({ size = 44 }) {
  const g = size * 0.6;
  return (
    <div style={{ width: size, height: size, borderRadius: size * 0.27, background: "var(--c-primary)", display: "grid", placeItems: "center", flexShrink: 0 }}>
      <span style={{ position: "relative", display: "inline-block", fontFamily: PJS, fontWeight: 800, fontSize: g, color: "#fff", lineHeight: 1 }}>
        D
        <span style={{ position: "absolute", left: "57%", top: "53%", transform: "translate(-50%,-50%)", width: g * 0.2, height: g * 0.2, borderRadius: "50%", background: "var(--c-accent)" }} />
      </span>
    </div>
  );
}
function Wordmark({ size = 22 }) {
  return (
    <span style={{ fontFamily: PJS, fontWeight: 800, fontSize: size, letterSpacing: "-0.01em", color: "var(--c-text)", lineHeight: 1, whiteSpace: "nowrap" }}>
      ALLDEEZ<span style={{ color: "var(--c-primary)" }}>Meals</span>
    </span>
  );
}
function AppHeader({ active = "Today", compact = false }) {
  const tab = (label) => <button key={label} className="navtab" data-active={label === active}>{label}</button>;
  return (
    <div style={{ background: "var(--c-surface)", borderBottom: "1px solid var(--c-border)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "16px 22px" }}>
        <DPlateIcon size={46} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <Wordmark size={23} />
          <div className="wm-caption wm-muted" style={{ marginTop: 3 }}>A week of dinners, planned in minutes</div>
        </div>
        <span className="wm-bodysm wm-muted" style={{ flexShrink: 0 }}>chris.ball@terenc.com</span>
        <span style={{ width: 30, height: 30, borderRadius: "50%", border: "1px solid var(--c-border)", flexShrink: 0 }} />
      </div>
      <div style={{ padding: "0 14px 12px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, background: "var(--c-surface-2)", borderRadius: 12, padding: 6, overflowX: "auto" }}>
          {tab("Today")}
          <div style={{ display: "flex", alignItems: "center", gap: 2, padding: "3px 8px 3px 10px", border: "1px solid", borderColor: (active === "Setup" || active === "Meals") ? "var(--c-primary)" : "var(--c-border)", borderRadius: 10, background: "rgba(43,140,126,0.06)", flexShrink: 0 }}>
            <span style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".08em", textTransform: "uppercase", color: "var(--c-text-muted)", marginRight: 3 }}>Planning</span>
            {tab("Setup")}
            {tab("Meals")}
          </div>
          {tab("Shopping List")}
          {tab("Recipe Box")}
          {tab("Receipt")}
          {tab("History")}
          {tab("Catalog")}
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div className="page">
      <h1 className="intro-h">Planning &amp; Shopping — the rest of the loop</h1>
      <p className="wm-bodysm wm-muted" style={{ marginTop: 6 }}>Setup + Meals unified under one Planning flow, and the re-skinned Shopping List. Plan → Shop → Cook, all on the final brand. (Sub-tabs and checkboxes are live — try them.)</p>

      <div className="sec-label">Planning · Setup + Meals in one flow</div>
      <div className="frame">
        <AppHeader active="Setup" />
        <PlanningView initial="setup" />
      </div>

      <div className="sec-label">Shopping List</div>
      <div className="frame">
        <AppHeader active="Shopping List" />
        <ShoppingList />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <rect x="24" y="46" width="52" height="6" rx="3" fill="#F2856B"/>
  <rect x="24" y="58" width="38" height="6" rx="3" fill="#FBF7F1"/>
  <rect x="24" y="68" width="44" height="6" rx="3" fill="#FBF7F1"/>
</svg>
</template>
</body>

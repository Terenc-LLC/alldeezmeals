<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALLDEEZMeals — D-Plate Refinement</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" />
<style id="warm-market-tokens">
:root {
  --c-primary: #2B8C7E; --c-primary-hover: #236F64;
  --c-accent: #F2856B; --c-bg: #FBF7F1; --c-surface: #FFFFFF; --c-surface-2: #F4F1E9;
  --c-text: #1A3A34; --c-text-muted: #7C8A80; --c-border: #E6DDD0;
  --c-success-bg: #E6F1EC; --c-success-text: #136B58;
  --font-serif: 'Fraunces', Georgia, serif;
  --font-sans: 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius-md: 12px; --radius-lg: 16px;
  --elev-1: 0 1px 2px rgba(26,58,52,.06), 0 1px 3px rgba(26,58,52,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--c-bg); font-family: var(--font-sans); color: var(--c-text); -webkit-font-smoothing: antialiased; }
.wm-h1 { font-family: var(--font-serif); font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.muted { color: var(--c-text-muted); }
.cap { font-size: 11px; line-height: 14px; font-weight: 600; }
.label { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.bodysm { font-size: 13px; line-height: 18px; }
.page { max-width: 1080px; margin: 0 auto; padding: 40px 32px 80px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 26px; }
@media (max-width: 820px) { .grid { grid-template-columns: repeat(2, 1fr); } }
.card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--radius-lg); box-shadow: var(--elev-1); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.hero { height: 150px; display: grid; place-items: center; }
.favs { display: flex; align-items: flex-end; gap: 18px; }
.favcol { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.rec { background: var(--c-success-bg); border: 1px solid var(--c-border); border-radius: var(--radius-md); padding: 14px 18px; margin-top: 16px; color: var(--c-success-text); font-size: 15px; }
.recwrap { border: 2px solid var(--c-primary); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const TEAL = "var(--c-primary)", CORAL = "var(--c-accent)", CREAM = "var(--c-surface)";

/* one parametric D-Plate */
function DPlate({ g = 110, dot = 0.17, top = "52%", left = "53%", ring = false, reversed = false, mono = false, plateLine = false, weight = 600 }) {
  const dColor = mono ? (reversed ? "#fff" : TEAL) : CORAL;
  return (
    <span style={{ position: "relative", display: "inline-block", fontFamily: "var(--font-serif)", fontWeight: weight, fontSize: g, color: reversed ? "#fff" : TEAL, lineHeight: 1 }}>
      D
      <span style={{ position: "absolute", left, top, transform: "translate(-50%,-50%)",
        width: g * dot, height: g * dot, borderRadius: "50%",
        background: ring ? "transparent" : dColor,
        border: ring ? `${Math.max(1.5, g * 0.04)}px solid ${dColor}` : "none", boxSizing: "border-box" }} />
      {plateLine && <span style={{ position: "absolute", left: "49%", bottom: "9%", transform: "translateX(-50%)", width: g * 0.42, height: Math.max(2, g * 0.05), borderRadius: 99, background: CORAL }} />}
    </span>
  );
}

function Tile({ size, reversed, children }) {
  return (
    <div style={{ width: size, height: size, borderRadius: size * 0.24, background: reversed ? TEAL : CREAM,
      border: reversed ? "none" : "1px solid var(--c-border)", display: "grid", placeItems: "center",
      boxShadow: "0 1px 2px rgba(26,58,52,.12)", flexShrink: 0, overflow: "hidden" }}>{children}</div>
  );
}

const VARIANTS = [
  { name: "A · Baseline", note: "The current treatment — dot centered in the counter.", cfg: { dot: 0.17, top: "52%", left: "53%" }, rec: true },
  { name: "B · Bolder dish", note: "Larger dot — the meal reads from further away.", cfg: { dot: 0.24, top: "52%", left: "53%" } },
  { name: "C · Settled", note: "Smaller dot, nudged low — food resting in the bowl.", cfg: { dot: 0.14, top: "60%", left: "56%" } },
  { name: "D · App tile (reversed)", note: "White D + coral dot on teal — the home-screen icon.", cfg: { dot: 0.17, top: "52%", left: "53%", reversed: true }, reversed: true },
  { name: "E · On the plate", note: "A coral plate-line under the D grounds it as a setting.", cfg: { dot: 0.14, top: "48%", left: "55%", plateLine: true } },
  { name: "F · Monochrome", note: "Single-color fallback for stamps, embossing, one-ink print.", cfg: { dot: 0.17, top: "52%", left: "53%", mono: true } },
];

function Card({ v }) {
  return (
    <div className={"card" + (v.rec ? " recwrap" : "")}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span className="label muted">{v.name}</span>
        {v.rec && <span style={{ fontSize: 11, fontWeight: 700, color: TEAL }}>RECOMMENDED</span>}
      </div>
      <div className="hero"><Tile size={120} reversed={v.reversed}><DPlate g={120 * 0.74} {...v.cfg} /></Tile></div>
      <div className="favs">
        {[16, 24, 32].map((s) => (
          <div className="favcol" key={s}>
            <Tile size={s} reversed={v.reversed}><DPlate g={s * 0.74} {...v.cfg} /></Tile>
            <span className="cap muted">{s}</span>
          </div>
        ))}
      </div>
      <p className="bodysm muted" style={{ marginTop: "auto" }}>{v.note}</p>
    </div>
  );
}

function Lockup({ reversed }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, background: reversed ? TEAL : CREAM, border: "1px solid var(--c-border)", borderRadius: 16, padding: "16px 22px", boxShadow: "var(--elev-1)" }}>
      <Tile size={48} reversed={reversed}><DPlate g={48 * 0.74} dot={0.17} top="52%" left="53%" reversed={reversed} /></Tile>
      <span style={{ fontFamily: "var(--font-serif)", fontWeight: 600, fontSize: 26, letterSpacing: "-0.015em", color: reversed ? "#fff" : "var(--c-text)" }}>
        ALLDEEZ<span style={{ color: reversed ? "#fff" : TEAL }}>Meals</span>
      </span>
    </div>
  );
}

function App() {
  return (
    <div className="page">
      <h1 className="wm-h1">D-Plate — refinement</h1>
      <p className="bodysm muted" style={{ marginTop: 6 }}>Dialing in the dot (size + position), the reversed app tile, and a couple of “more obviously a plate” takes. All at favicon sizes too.</p>

      <div style={{ display: "flex", gap: 18, flexWrap: "wrap", marginTop: 22 }}>
        <Lockup />
        <Lockup reversed />
      </div>

      <div className="grid">
        {VARIANTS.map((v) => <Card key={v.name} v={v} />)}
      </div>

      <div className="rec"><strong>My recommendation:</strong> keep <strong>A</strong> as the master mark, and use <strong>D</strong> (reversed) as the actual home-screen / favicon tile. <strong>F</strong> is your one-ink fallback. B reads a touch heavy; C and E are nice but slightly muddier when tiny.</div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#2B8C7E"/>
  <rect x="26" y="26" width="48" height="48" rx="12" fill="#FBF7F1"/>
  <text x="44" y="68" font-family="Georgia,serif" font-size="48" font-weight="700" fill="#2B8C7E">D</text>
  <circle cx="52" cy="52" r="6" fill="#F2856B"/>
</svg>
</template>
</body>
</html>

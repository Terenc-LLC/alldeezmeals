<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALLDEEZMeals — Planning Recipe Card v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
<style>
/* ── Design tokens (warm-market, PJS override) ──────────────────── */
:root {
  --c-primary:#2B8C7E; --c-primary-hover:#236F64; --c-accent:#F2856B;
  --c-accent-hover:#E37152; --c-bg:#FBF7F1; --c-surface:#FFFFFF;
  --c-surface-2:#F4F1E9; --c-text:#1A3A34; --c-text-muted:#7C8A80;
  --c-border:#E6DDD0; --c-on-primary:#FFFFFF;
  --c-success-bg:#E6F1EC; --c-success-text:#136B58;
  --c-pill-bg:#F2856B; --c-pill-text:#5E281A;
  --c-danger:#A8453C; --c-danger-bg:#F6E7E4;
  --c-warning:#8A6D3B; --c-warning-bg:#F3EAD6;
  --c-primary-tint:#E4F0EC; --c-shadow:26 58 52;

  --font-serif:'Plus Jakarta Sans',-apple-system,sans-serif;
  --font-sans:'Plus Jakarta Sans',-apple-system,sans-serif;

  --t-display-size:28px; --t-display-lh:32px; --t-display-w:600;
  --t-h1-size:22px;      --t-h1-lh:28px;      --t-h1-w:700;
  --t-h2-size:19px;      --t-h2-lh:25px;      --t-h2-w:600;
  --t-h3-size:16px;      --t-h3-lh:22px;      --t-h3-w:600;
  --t-bodylg-size:16px;  --t-bodylg-lh:24px;  --t-bodylg-w:400;
  --t-body-size:15px;    --t-body-lh:22px;    --t-body-w:400;
  --t-bodysm-size:13px;  --t-bodysm-lh:18px;  --t-bodysm-w:400;
  --t-label-size:12px;   --t-label-lh:16px;   --t-label-w:700; --t-label-tracking:0.05em;
  --t-caption-size:11px; --t-caption-lh:14px; --t-caption-w:600;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;

  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-pill:999px;

  --elev-0:none;
  --elev-1:0 1px 2px rgba(var(--c-shadow)/.06),0 1px 3px rgba(var(--c-shadow)/.05);
  --elev-2:0 4px 14px rgba(var(--c-shadow)/.09),0 2px 6px rgba(var(--c-shadow)/.05);
  --elev-primary:0 2px 8px rgba(43,140,126,.28);
  --tap-min:44px; --focus-ring:0 0 0 3px rgba(43,140,126,.30);
}
/* ── Base ── */
.wm { font-family:var(--font-sans); color:var(--c-text); background:var(--c-bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
.wm *,.wm *::before,.wm *::after { box-sizing:border-box; }
.wm-h1  { font-family:var(--font-sans); font-size:var(--t-h1-size); line-height:var(--t-h1-lh); font-weight:var(--t-h1-w); letter-spacing:-0.01em; margin:0; }
.wm-h2  { font-family:var(--font-sans); font-size:var(--t-h2-size); line-height:var(--t-h2-lh); font-weight:var(--t-h2-w); letter-spacing:-0.01em; margin:0; }
.wm-h3  { font-family:var(--font-sans); font-size:var(--t-h3-size); line-height:var(--t-h3-lh); font-weight:var(--t-h3-w); margin:0; }
.wm-bodylg { font-family:var(--font-sans); font-size:var(--t-bodylg-size); line-height:var(--t-bodylg-lh); font-weight:var(--t-bodylg-w); margin:0; }
.wm-body   { font-family:var(--font-sans); font-size:var(--t-body-size);   line-height:var(--t-body-lh);   font-weight:var(--t-body-w);   margin:0; }
.wm-bodysm { font-family:var(--font-sans); font-size:var(--t-bodysm-size); line-height:var(--t-bodysm-lh); font-weight:var(--t-bodysm-w); margin:0; }
.wm-label  { font-family:var(--font-sans); font-size:var(--t-label-size);  line-height:var(--t-label-lh);  font-weight:var(--t-label-w); letter-spacing:var(--t-label-tracking); text-transform:uppercase; margin:0; }
.wm-caption{ font-family:var(--font-sans); font-size:var(--t-caption-size);line-height:var(--t-caption-lh);font-weight:var(--t-caption-w); margin:0; }
.wm-muted  { color:var(--c-text-muted); }
/* ── Surfaces ── */
.wm-card { background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius-lg); box-shadow:var(--elev-1); padding:var(--space-4); }
/* ── Buttons ── */
.wm-btn { font-family:var(--font-sans); font-weight:700; font-size:var(--t-body-size);
  display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2);
  min-height:var(--tap-min); padding:0 var(--space-4); border-radius:var(--radius-md);
  border:1px solid transparent; cursor:pointer;
  transition:background .15s,box-shadow .15s,border-color .15s,transform .05s; white-space:nowrap; }
.wm-btn:active { transform:translateY(1px); }
.wm-btn:focus-visible { outline:none; box-shadow:var(--focus-ring); }
.wm-btn--primary   { background:var(--c-primary); color:var(--c-on-primary); box-shadow:var(--elev-primary); }
.wm-btn--primary:hover { background:var(--c-primary-hover); }
.wm-btn--secondary { background:var(--c-surface); color:var(--c-primary); border-color:var(--c-border); }
.wm-btn--secondary:hover { background:var(--c-surface-2); border-color:var(--c-primary); }
.wm-btn--ghost  { background:transparent; color:var(--c-text-muted); border-color:var(--c-border); }
.wm-btn--ghost:hover { background:var(--c-surface-2); color:var(--c-text); }
.wm-btn--block  { width:100%; }
.wm-btn--sm { min-height:36px; font-size:var(--t-bodysm-size); padding:0 var(--space-3); border-radius:var(--radius-sm); }
/* ── Tags ── */
.wm-tag { display:inline-flex; align-items:center; gap:var(--space-1); font-family:var(--font-sans); font-weight:600;
  font-size:var(--t-caption-size); line-height:1; padding:5px 10px; border-radius:var(--radius-pill);
  background:var(--c-surface-2); color:var(--c-text-muted); }
.wm-tag--cuisine { background:var(--c-accent); color:var(--c-pill-text); font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
.wm-tag--effort  { background:var(--c-accent); color:var(--c-pill-text); font-weight:700; }
.wm-tag--est     { background:var(--c-warning-bg); color:var(--c-warning); font-weight:700; }
/* ── Divider ── */
.wm-divider { height:1px; background:var(--c-border); border:0; margin:var(--space-4) 0; }

/* ── Page ── */
html,body { margin:0; }
body { background:var(--c-bg); font-family:var(--font-sans); color:var(--c-text); -webkit-font-smoothing:antialiased; }
.page { max-width:980px; margin:0 auto; padding:36px 24px 80px; }
.page-title { font-size:22px; font-weight:700; letter-spacing:-0.01em; margin:0; }
.sec-label { font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--c-text-muted); margin:32px 0 10px; }
/* Device frame */
.frame { border:1px solid var(--c-border); border-radius:18px; overflow:hidden;
  box-shadow:0 8px 32px rgba(26,58,52,.12); background:var(--c-surface);
  display:flex; flex-direction:column; }
.frame--mobile { max-width:390px; height:760px; }
.frame--desktop { max-width:820px; height:700px; }
/* Nav */
.navtab { font-family:var(--font-sans); font-size:13px; font-weight:600; border:none;
  background:transparent; color:var(--c-text-muted); padding:8px 12px; border-radius:9px;
  cursor:pointer; white-space:nowrap; }
.navtab[data-active="true"] { background:var(--c-surface); color:var(--c-primary); font-weight:700; box-shadow:0 1px 3px rgba(26,58,52,.12); }
/* Spec */
.spec-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:var(--space-4); margin-top:var(--space-4); }
.spec-card { background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--radius-lg); padding:var(--space-4); }
.spec-card h4 { font-size:13px; font-weight:700; margin:0 0 var(--space-3); }
.spec-row { display:flex; gap:var(--space-2); align-items:baseline; padding:4px 0; border-bottom:1px solid var(--c-surface-2); }
.spec-row:last-child { border-bottom:none; }
.spec-key { flex:1; color:var(--c-text-muted); font-family:monospace; font-size:11px; }
.spec-val { color:var(--c-text); font-weight:600; font-family:monospace; font-size:11px; text-align:right; }
/* Legend swatches */
.legend { display:flex; flex-wrap:wrap; gap:var(--space-3); margin-top:var(--space-4); }
.legend-item { display:flex; align-items:center; gap:var(--space-2); font-size:13px; }
.swatch { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="frames/planning-v2.jsx"></script>

<script type="text/babel">
const PJS = "'Plus Jakarta Sans', sans-serif";

function DPlateIcon({ size = 40 }) {
  const g = size * 0.60;
  return (
    <div style={{ width: size, height: size, borderRadius: size * 0.27, background: "var(--c-primary)",
      display: "grid", placeItems: "center", flexShrink: 0 }}>
      <span style={{ position: "relative", display: "inline-block", fontFamily: PJS,
        fontWeight: 800, fontSize: g, color: "#fff", lineHeight: 1 }}>
        D
        <span style={{ position: "absolute", left: "57%", top: "53%",
          transform: "translate(-50%,-50%)", width: g * 0.2, height: g * 0.2,
          borderRadius: "50%", background: "var(--c-accent)" }} />
      </span>
    </div>
  );
}

function Wordmark({ size = 21 }) {
  return (
    <span style={{ fontFamily: PJS, fontWeight: 800, fontSize: size,
      letterSpacing: "-0.01em", color: "var(--c-text)", lineHeight: 1, whiteSpace: "nowrap" }}>
      ALLDEEZ<span style={{ color: "var(--c-primary)" }}>Meals</span>
    </span>
  );
}

function AppHeader({ active = "Meals" }) {
  const tab = (label) => (
    <button key={label} className="navtab" data-active={label === active}>{label}</button>
  );
  return (
    <div style={{ background: "var(--c-surface)", borderBottom: "1px solid var(--c-border)", flexShrink: 0 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 20px" }}>
        <DPlateIcon size={40} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <Wordmark size={20} />
          <div style={{ fontSize: 11, fontWeight: 600, color: "var(--c-text-muted)", marginTop: 2 }}>
            A week of dinners, planned in minutes
          </div>
        </div>
      </div>
      <div style={{ padding: "0 12px 10px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 4, background: "var(--c-surface-2)",
          borderRadius: 12, padding: 5, overflowX: "auto" }}>
          {tab("Today")}
          <div style={{ display: "flex", alignItems: "center", gap: 2, padding: "3px 8px 3px 10px",
            border: "1px solid", borderColor: "var(--c-primary)", borderRadius: 9,
            background: "rgba(43,140,126,0.06)", flexShrink: 0 }}>
            <span style={{ fontSize: 9, fontWeight: 800, letterSpacing: ".08em", textTransform: "uppercase",
              color: "var(--c-text-muted)", marginRight: 3 }}>Planning</span>
            {tab("Setup")}{tab("Meals")}
          </div>
          {tab("Shopping List")}{tab("Recipe Box")}{tab("Receipt")}
        </div>
      </div>
    </div>
  );
}

/* ── Planning shell: Setup / Meals sub-toggle wrapping MealsPaneV2 ── */
function PlanningShell() {
  const [sub, setSub] = React.useState("meals");

  function SubTab({ id, label, n }) {
    const active = sub === id;
    return (
      <button onClick={() => setSub(id)}
        style={{
          flex: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8,
          fontFamily: PJS, fontWeight: 700, fontSize: 14, cursor: "pointer",
          padding: "10px 14px", borderRadius: 10, border: "none",
          background: active ? "var(--c-surface)" : "transparent",
          color: active ? "var(--c-primary)" : "var(--c-text-muted)",
          boxShadow: active ? "0 1px 3px rgba(26,58,52,.12)" : "none",
        }}>
        <span style={{ width: 20, height: 20, borderRadius: "50%", display: "grid", placeItems: "center",
          fontSize: 11, fontWeight: 800,
          background: active ? "var(--c-primary)" : "var(--c-surface-2)",
          color: active ? "#fff" : "var(--c-text-muted)" }}>{n}</span>
        {label}
      </button>
    );
  }

  return (
    <div className="wm" style={{ background: "var(--c-bg)", minHeight: "100%", overflowY: "auto" }}>
      <div style={{ padding: "var(--space-5) var(--space-5) 0" }}>
        <p className="wm-label" style={{ color: "var(--c-primary)" }}>Planning</p>
        <h1 className="wm-h1" style={{ marginTop: 2 }}>Plan your week</h1>
        <p className="wm-bodysm wm-muted" style={{ marginTop: 4 }}>Set it up, then review what we generated — two steps, one place.</p>
      </div>
      <div style={{ padding: "var(--space-4) var(--space-5)" }}>
        <div style={{ display: "flex", gap: 4, background: "var(--c-surface-2)", borderRadius: 12, padding: 5, marginBottom: "var(--space-5)" }}>
          <SubTab id="setup" label="Setup" n="1" />
          <SubTab id="meals" label="Meals" n="2" />
        </div>
        {sub === "setup" ? (
          /* Placeholder — Setup pane unchanged from v1 */
          <div style={{ display: "grid", gap: "var(--space-4)" }}>
            <div className="wm-card">
              <p className="wm-bodysm wm-muted" style={{ textAlign: "center", padding: "var(--space-6) 0" }}>
                Setup pane — unchanged from v1.<br />
                Switch to <strong>Meals</strong> to see the redesigned recipe card.
              </p>
            </div>
          </div>
        ) : (
          <MealsPaneV2 />
        )}
      </div>
    </div>
  );
}

/* ── Desktop side-by-side: two frames ── */
function DesktopLayout() {
  return (
    <div style={{ display: "grid", gridTemplateColumns: "390px 1fr", gap: "var(--space-6)", alignItems: "start" }}>
      {/* Mobile */}
      <div>
        <div className="sec-label" style={{ margin: "0 0 10px" }}>Mobile · 390 px</div>
        <div className="frame frame--mobile">
          <AppHeader active="Meals" />
          <div style={{ flex: 1, overflow: "hidden", display: "flex", flexDirection: "column" }}>
            <PlanningShell />
          </div>
        </div>
      </div>
      {/* Wider card */}
      <div>
        <div className="sec-label" style={{ margin: "0 0 10px" }}>Wider breakpoint · card expands</div>
        <div className="frame" style={{ height: 760 }}>
          <AppHeader active="Meals" />
          <div style={{ flex: 1, overflowY: "auto" }}>
            <div className="wm" style={{ background: "var(--c-bg)", padding: "var(--space-5)" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "var(--space-4)" }}>
                <div>
                  <p className="wm-label" style={{ color: "var(--c-primary)" }}>Planning</p>
                  <h1 className="wm-h1" style={{ marginTop: 2 }}>Plan your week</h1>
                </div>
              </div>
              <MealsPaneV2 />
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div className="page">
      <p className="wm-label wm-muted" style={{ marginBottom: 6 }}>Design pass v2</p>
      <h1 className="page-title">Planning Meals — recipe card</h1>
      <p className="wm-bodysm wm-muted" style={{ marginTop: 6, maxWidth: 600 }}>
        Replaces the crammed pill row + wall of instruction text with a scannable
        ingredient list (name · qty · purchase note) and clearly spaced numbered steps.
        Day-rail navigation keeps review efficient — tap any weekday to jump.
        Try Thu for a buy-heavy meal; Mon to see reuse badges; Wed for "some effort."
      </p>

      {/* Purchase note legend */}
      <div className="legend">
        <div className="legend-item">
          <div className="swatch" style={{ background: "var(--c-text-muted)" }}></div>
          <span className="wm-bodysm wm-muted">buy · plain muted text — standard purchase</span>
        </div>
        <div className="legend-item">
          <div className="swatch" style={{ background: "var(--c-success-bg)", border: "1px solid var(--c-success-text)" }}></div>
          <span className="wm-bodysm wm-muted">reuse · green badge — already bought or batch-prepped</span>
        </div>
        <div className="legend-item">
          <div className="swatch" style={{ background: "var(--c-warning-bg)", border: "1px solid var(--c-warning)" }}></div>
          <span className="wm-bodysm wm-muted">staple · amber badge — auto-excluded from shopping list</span>
        </div>
      </div>

      <div style={{ marginTop: "var(--space-6)" }}>
        <DesktopLayout />
      </div>

      {/* Token specs */}
      <div className="sec-label">Token specs — new component patterns</div>
      <div className="spec-grid">

        <div className="spec-card">
          <h4>Ingredient list row</h4>
          <div className="spec-row"><span className="spec-key">display</span><span className="spec-val">flex, alignItems:baseline</span></div>
          <div className="spec-row"><span className="spec-key">padding</span><span className="spec-val">9px 0</span></div>
          <div className="spec-row"><span className="spec-key">divider</span><span className="spec-val">1px --c-surface-2</span></div>
          <div className="spec-row"><span className="spec-key">name</span><span className="spec-val">flex:1, fontWeight:600, --t-body-*</span></div>
          <div className="spec-row"><span className="spec-key">qty</span><span className="spec-val">--t-caption-*, --c-text-muted, minWidth:58</span></div>
          <div className="spec-row"><span className="spec-key">note (buy)</span><span className="spec-val">--t-caption-*, --c-text-muted, no badge</span></div>
        </div>

        <div className="spec-card">
          <h4>Purchase note — "reuse" badge</h4>
          <div className="spec-row"><span className="spec-key">background</span><span className="spec-val">--c-success-bg</span></div>
          <div className="spec-row"><span className="spec-key">color</span><span className="spec-val">--c-success-text</span></div>
          <div className="spec-row"><span className="spec-key">fontSize</span><span className="spec-val">10px</span></div>
          <div className="spec-row"><span className="spec-key">fontWeight</span><span className="spec-val">600</span></div>
          <div className="spec-row"><span className="spec-key">padding</span><span className="spec-val">2px 6px</span></div>
          <div className="spec-row"><span className="spec-key">borderRadius</span><span className="spec-val">--radius-pill</span></div>
        </div>

        <div className="spec-card">
          <h4>Purchase note — "staple" badge</h4>
          <div className="spec-row"><span className="spec-key">background</span><span className="spec-val">--c-warning-bg</span></div>
          <div className="spec-row"><span className="spec-key">color</span><span className="spec-val">--c-warning</span></div>
          <div className="spec-row"><span className="spec-key">fontSize</span><span className="spec-val">10px</span></div>
          <div className="spec-row"><span className="spec-key">fontWeight</span><span className="spec-val">600</span></div>
          <div className="spec-row"><span className="spec-key">padding</span><span className="spec-val">2px 6px</span></div>
          <div className="spec-row"><span className="spec-key">borderRadius</span><span className="spec-val">--radius-pill</span></div>
        </div>

        <div className="spec-card">
          <h4>Step number badge</h4>
          <div className="spec-row"><span className="spec-key">background</span><span className="spec-val">--c-primary-tint</span></div>
          <div className="spec-row"><span className="spec-key">color</span><span className="spec-val">--c-primary</span></div>
          <div className="spec-row"><span className="spec-key">size</span><span className="spec-val">26×26px</span></div>
          <div className="spec-row"><span className="spec-key">borderRadius</span><span className="spec-val">--radius-pill</span></div>
          <div className="spec-row"><span className="spec-key">fontSize</span><span className="spec-val">12px / 700</span></div>
          <div className="spec-row"><span className="spec-key">gap to text</span><span className="spec-val">--space-3</span></div>
        </div>

        <div className="spec-card">
          <h4>Step text</h4>
          <div className="spec-row"><span className="spec-key">style</span><span className="spec-val">--t-body-* (15/22/400)</span></div>
          <div className="spec-row"><span className="spec-key">color</span><span className="spec-val">--c-text</span></div>
          <div className="spec-row"><span className="spec-key">paddingTop</span><span className="spec-val">3px (aligns with badge)</span></div>
          <div className="spec-row"><span className="spec-key">gap between steps</span><span className="spec-val">--space-4 (16px)</span></div>
        </div>

        <div className="spec-card">
          <h4>Section labels (Ingredients · Steps)</h4>
          <div className="spec-row"><span className="spec-key">style</span><span className="spec-val">--t-label-* (uppercase, tracked)</span></div>
          <div className="spec-row"><span className="spec-key">color</span><span className="spec-val">--c-text-muted</span></div>
          <div className="spec-row"><span className="spec-key">marginBottom</span><span className="spec-val">--space-3 (ingredients), --space-4 (steps)</span></div>
          <div className="spec-row"><span className="spec-key">count suffix</span><span className="spec-val">· {"{n}"} — inline, same style</span></div>
        </div>

        <div className="spec-card">
          <h4>Day rail navigator</h4>
          <div className="spec-row"><span className="spec-key">layout</span><span className="spec-val">display:flex, gap:--space-1</span></div>
          <div className="spec-row"><span className="spec-key">button</span><span className="spec-val">flex:1, padding:6px 2px</span></div>
          <div className="spec-row"><span className="spec-key">active bg</span><span className="spec-val">--c-primary</span></div>
          <div className="spec-row"><span className="spec-key">active color</span><span className="spec-val">--c-on-primary</span></div>
          <div className="spec-row"><span className="spec-key">inactive bg</span><span className="spec-val">--c-surface-2</span></div>
          <div className="spec-row"><span className="spec-key">borderRadius</span><span className="spec-val">--radius-sm</span></div>
          <div className="spec-row"><span className="spec-key">font</span><span className="spec-val">11px / 700</span></div>
        </div>

        <div className="spec-card">
          <h4>Actions row</h4>
          <div className="spec-row"><span className="spec-key">borderTop</span><span className="spec-val">1px --c-border</span></div>
          <div className="spec-row"><span className="spec-key">paddingTop</span><span className="spec-val">--space-4</span></div>
          <div className="spec-row"><span className="spec-key">Swap</span><span className="spec-val">.wm-btn--secondary .wm-btn--sm</span></div>
          <div className="spec-row"><span className="spec-key">thumbs 👍👎</span><span className="spec-val">.wm-btn--ghost .wm-btn--sm</span></div>
          <div className="spec-row"><span className="spec-key">Recipe Box ★</span><span className="spec-val">.wm-btn--ghost, star fill on save</span></div>
          <div className="spec-row"><span className="spec-key">Next</span><span className="spec-val">.wm-btn--primary .wm-btn--sm, rightmost</span></div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
